name: Translation fix
description: A wrong, unclear or missing text in one of the 12 languages.
labels: [i18n]
body:
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [English, Deutsch, Español, Français, Português, Русский, 日本語, 简体中文, 繁體中文, العربية, Bahasa Indonesia, Bahasa Melayu]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Current text and suggested text
    validations:
      required: true
