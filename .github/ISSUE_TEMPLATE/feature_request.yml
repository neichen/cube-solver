name: Feature request
description: Suggest a new puzzle, feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: context
    attributes:
      label: Anything else? (links, references, licenses of code you would like to reuse)
